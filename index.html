<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Garden of Bird Song</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d2f2b;--ink:#dcebc8;--pad:#2d4a3a;--edge:#4f7a55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13211f;--ink:#d3e6bd}}
:root[data-theme="dark"]{--bg:#13211f;--ink:#d3e6bd}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:'Press Start 2P',monospace,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{image-rendering:pixelated;border-radius:6px;box-shadow:0 0 0 4px var(--pad),0 0 0 6px var(--edge),0 14px 40px rgba(0,0,0,.45)}
#pad{display:none;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(2,56px);gap:6px}
@media (pointer:coarse){#pad{display:grid}}
#pad button{background:var(--pad);color:var(--ink);border:2px solid var(--edge);border-radius:8px;font:inherit;font-size:16px;touch-action:none}
#pad button:active{background:var(--edge)}
</style>
</head>
<body>
<canvas id="c" aria-label="The Garden of Bird Song, a pixel-art garden you can walk through"></canvas>
<div id="pad">
<button data-d="1" style="grid-column:2;grid-row:1" aria-label="Up">&#9650;</button>
<button data-d="2" style="grid-column:1;grid-row:2" aria-label="Left">&#9664;</button>
<button data-d="0" style="grid-column:2;grid-row:2" aria-label="Down">&#9660;</button>
<button data-d="3" style="grid-column:3;grid-row:2" aria-label="Right">&#9654;</button>
</div>
<script>
(()=>{
const TS=16,VW=15,VH=11,W=64,H=48,STEP=.24;
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=VW*TS;cv.height=VH*TS;ctx.imageSmoothingEnabled=false;
const coarse=matchMedia('(pointer:coarse)').matches;
function fit(){
  let s=Math.min((innerWidth-16)/cv.width,(innerHeight-(coarse?160:48))/cv.height);
  s=s>=2?Math.floor(s):Math.max(.5,s);
  cv.style.width=cv.width*s+'px';cv.style.height=cv.height*s+'px';
}
addEventListener('resize',fit);fit();

/* ---------- helpers ---------- */
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng((Math.random()*4294967296)>>>0);   // new random world on every load
function noise(cell){
  const n=Math.ceil(64/cell)+3,g=[];
  for(let j=0;j<n;j++){g[j]=[];for(let i=0;i<n;i++)g[j][i]=R();}
  return(x,y)=>{const gx=x/cell,gy=y/cell,i=gx|0,j=gy|0,fx=gx-i,fy=gy-j,
    u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),a=g[j][i],b=g[j][i+1],c=g[j+1][i],d=g[j+1][i+1];
    return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};
}
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
function ell(g,cx,cy,rx,ry,col){g.fillStyle=col;for(let y=-ry;y<=ry;y++){const h=Math.round(rx*Math.sqrt(1-y*y/(ry*ry+.01)));g.fillRect(cx-h,cy+y,h*2,1)}}

/* ---------- sprites ---------- */
function mkGrass(b,d,l,seed){
  const c=mk(16,16),g=c.getContext('2d'),r=rng(seed);
  g.fillStyle=b;g.fillRect(0,0,16,16);
  for(let i=0;i<9;i++){const x=r()*13|0,y=1+(r()*13|0);
    g.fillStyle=d;g.fillRect(x,y,1,2);g.fillRect(x+2,y+1,1,1);
    g.fillStyle=l;g.fillRect(x+1,y-1,1,1);}
  return c;
}
const G1=[1,2,3].map(s=>mkGrass('#74c95c','#5eb351','#97df76',s*91));
const G2=[1,2,3].map(s=>mkGrass('#5fb853','#4a9f49','#7acb64',s*57));
const WAT=[0,1].map(f=>{
  const c=mk(16,16),g=c.getContext('2d');
  g.fillStyle='#52b5dc';g.fillRect(0,0,16,16);
  g.fillStyle='#4aaad4';g.fillRect(0,5,16,2);g.fillRect(0,12,16,2);
  g.fillStyle='#9fe3f3';g.fillRect((2+f*4)%12,3,4,1);g.fillRect((9-f*4+12)%12,9,3,1);g.fillRect((5+f*5)%12,14,4,1);
  g.fillStyle='#fff';g.fillRect(f?12:4,f?4:10,1,1);
  return c;
});
const PAL=[
  {d:'#2f7d3b',m:'#4cae4d',l:'#79d062',h:'#b7ee7a'},   // green
  {d:'#21643a',m:'#348a47',l:'#52ad5a',h:'#8fd67a'},   // deep green
  {d:'#d96aa0',m:'#f48fbd',l:'#ffb8d8',h:'#fff0f6'},   // blossom
  {d:'#a39a2e',m:'#cdbd3d',l:'#eadb5e',h:'#fff6a8'},   // golden
  {d:'#4a3fa8',m:'#6f66d9',l:'#9d94f5',h:'#c8fbff'}    // magic
];
function mkTree(p,seed){
  const r=rng(seed),tr=mk(32,40),cn=mk(32,40),a=tr.getContext('2d'),g=cn.getContext('2d');
  ell(a,16,37,12,3,'rgba(20,40,30,.25)');
  a.fillStyle='#7a4a2b';a.fillRect(13,25,6,13);a.fillRect(11,35,10,3);
  a.fillStyle='#5a3620';a.fillRect(13,25,2,13);a.fillRect(11,37,10,1);
  a.fillStyle='#98643c';a.fillRect(17,25,1,11);
  ell(g,16,15,14,11,p.d);ell(g,15,13,13,10,p.m);ell(g,13,10,8,6,p.l);
  for(let i=0;i<80;i++){
    const x=3+r()*26|0,y=5+r()*18|0;
    if(((x-16)/14)**2+((y-15)/11)**2>.85)continue;
    const q=r();g.fillStyle=q<.18?p.h:q<.55?p.l:p.d;g.fillRect(x,y,q<.3?2:1,1);
  }
  return[tr,cn];
}
const TREES=PAL.map((p,i)=>[mkTree(p,i*31+5),mkTree(p,i*47+11)]);
const ROCK=(()=>{
  const c=mk(16,16),g=c.getContext('2d');
  ell(g,8,13,6,2,'rgba(20,40,30,.25)');ell(g,8,10,5,4,'#8d949c');ell(g,8,9,4,3,'#aab2ba');
  g.fillStyle='#d3dbe2';g.fillRect(6,7,3,1);g.fillStyle='#6c737b';g.fillRect(4,12,8,1);
  g.fillStyle='#5fb853';g.fillRect(5,6,3,1);g.fillRect(10,10,2,1);
  return c;
})();

/* ---------- world ---------- */
const T=new Uint8Array(W*H),B=new Uint8Array(W*H),TU=new Uint8Array(W*H),RK=new Uint8Array(W*H);
const FL=[],trees=[];
const nP=noise(9),nF=noise(6),nT=noise(5),nC=noise(5),nD=noise(7),nG=noise(8);
const SX=32,SY=24,near=(x,y,d)=>Math.abs(x-SX)<=d&&Math.abs(y-SY)<=d;
const edge=(x,y)=>x<1||y<1||x>=W-1||y>=H-1;
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=y*W+x;
  if(!edge(x,y)&&!near(x,y,4)&&nP(x,y)>.62){T[i]=1;B[i]=1;}
}
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=y*W+x;if(T[i])continue;
  let p=nF(x,y)>.56?.4:.025;if(near(x,y,3))p=0;
  if(edge(x,y)||R()<p){
    const q=R();
    const ty=nC(x,y)>.64&&R()<.6?2:q<.04?4:q<.14?3:q<.55?0:1;
    trees.push({x,y,t:ty,v:R()<.5?0:1,s:(x*7+y*13)%97});B[i]=1;
  }else if(!near(x,y,3)&&R()<.012){RK[i]=1;B[i]=1;}
}
trees.sort((a,b)=>a.y-b.y||a.x-b.x);
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const i=y*W+x;if(T[i]||B[i])continue;
  if(nT(x,y)>.6&&R()<.75||R()<.025)TU[i]=1;
  const dn=nD(x,y)>.52?.5:.08,n=nC(x+17,y+9),base=Math.floor(Math.min(.999,Math.max(0,(n-.25)/.5))*7);
  for(let k=0;k<3;k++)if(R()<dn*(k?.55:1)){
    let c=R()<.72?base:Math.floor(R()*7);if(R()<.025)c=7;
    (FL[i]=FL[i]||[]).push({x:2+(R()*11|0),y:2+(R()*8|0),c,k:R()*3|0});
  }
}

/* ---------- connectivity: carve paths to any cut-off pocket ---------- */
(function(){
  const N4=[[0,1],[0,-1],[-1,0],[1,0]],X=new Uint8Array(W*H);
  const flood=(seed,mark)=>{
    const q=[seed];mark[seed]=1;
    for(let h=0;h<q.length;h++){
      const c=q[h],cx=c%W,cy=c/W|0;
      for(const d of N4){
        const nx=cx+d[0],ny=cy+d[1];if(nx<0||ny<0||nx>=W||ny>=H)continue;
        const ni=ny*W+nx;if(!B[ni]&&!mark[ni]){mark[ni]=1;q.push(ni);}
      }
    }
    return q;
  };
  for(let guard=0;guard<1000;guard++){
    const rc=new Uint8Array(W*H);flood(SY*W+SX,rc);
    let seed=-1;
    for(let i=0;i<W*H;i++)if(!B[i]&&!rc[i]){seed=i;break;}
    if(seed<0)break;                                  // everything walkable is reachable
    const comp=new Uint8Array(W*H),cl=flood(seed,comp);
    const prev=new Int32Array(W*H).fill(-1),vis=new Uint8Array(W*H),q=cl.slice();
    for(const c of cl)vis[c]=1;
    let hit=-1,from=-1;
    for(let h=0;h<q.length&&hit<0;h++){
      const c=q[h],cx=c%W,cy=c/W|0;
      for(const d of N4){
        const nx=cx+d[0],ny=cy+d[1];
        if(nx<1||ny<1||nx>=W-1||ny>=H-1)continue;     // never touch the border trees
        const ni=ny*W+nx;if(vis[ni]||T[ni]||X[ni])continue;
        if(rc[ni]){hit=ni;from=c;break;}
        if(B[ni]){vis[ni]=1;prev[ni]=c;q.push(ni);}  // a tree or rock we can remove
      }
    }
    if(hit<0){for(const c of cl){B[c]=1;X[c]=1;}continue;}   // sealed in by water: wall it off
    for(let c=from;!comp[c];c=prev[c]){                 // clear the blockers along the shortest path
      B[c]=0;RK[c]=0;
      const k=trees.findIndex(t=>t.y*W+t.x===c);if(k>-1)trees.splice(k,1);
    }
  }
})();

/* ---------- birds ---------- */
const reach=new Uint8Array(W*H),q=[SY*W+SX];reach[q[0]]=1;
for(let h=0;h<q.length;h++){
  const c=q[h],cx=c%W,cy=c/W|0;
  for(let k=0;k<4;k++){
    const nx=cx+[0,0,-1,1][k],ny=cy+[1,-1,0,0][k];
    if(nx<0||ny<0||nx>=W||ny>=H)continue;
    const ni=ny*W+nx;
    if(!B[ni]&&!reach[ni]){reach[ni]=1;q.push(ni);}
  }
}
const cand=trees.filter(t=>{
  if(t.x<2||t.x>W-3||t.y<2||t.y>H-4)return false;
  if(!reach[(t.y+1)*W+t.x])return false;
  for(let dy=1;dy<=2;dy++)for(let dx=-1;dx<=1;dx++)if(B[(t.y+dy)*W+t.x+dx])return false;
  return true;
});
for(let i=cand.length-1;i>0;i--){const j=R()*(i+1)|0;[cand[i],cand[j]]=[cand[j],cand[i]];}
const BIRDS=[],BP=[['#e8553a','#9c2f22','#ffd2a8'],['#3c8be0','#1f4f9a','#e8f4ff'],['#2fc7b4','#1a7f74','#d6fff6'],['#f4f0e8','#b2aa9c','#ffffff'],['#8a66e8','#53399f','#e6ddff']];
for(const gap of [6,3,0]){
  for(const t of cand){
    if(BIRDS.length>=20)break;
    if(t.bird)continue;
    if(BIRDS.every(b=>Math.max(Math.abs(b.t.x-t.x),Math.abs(b.t.y-t.y))>=gap)){
      const b={t,c:BP[R()*5|0],f:R()<.5?1:0,ox:(R()*7|0)-3,oy:R()*5|0,sing:0,sx:0,sy:0};
      t.bird=b;BIRDS.push(b);
    }
  }
}

/* ---------- palette & wind ---------- */
const FC=['#ff7eb6','#ff5a6a','#ffd23f','#fff4e0','#b98cff','#6db7ff','#ff9f43','#8ff5ff'];
const TC=['#2f7f3d','#3f9a47','#66c457','#a6e873'];
const BL=[[2,6],[5,8],[8,5],[11,7],[13,5]];
const wind=(wx,wy,t)=>Math.max(0,.9+Math.sin(t*1.4-wx*.045-wy*.02)*.9+Math.sin(t*3.3-wx*.12)*.35)*(RM?.35:1);
const wat=(x,y)=>x<0||y<0||x>=W||y>=H?0:T[y*W+x];
const ED=[[0,-1],[0,1],[-1,0],[1,0]];
const FA=[[0,0,16,1],[0,15,16,1],[0,0,1,16],[15,0,1,16]];
const FB=[[0,1,16,1],[0,14,16,1],[1,0,1,16],[14,0,1,16]];

/* ---------- player & input ---------- */
const DX=[0,0,-1,1],DY=[1,-1,0,0];
const P={tx:SX,ty:SY,nx:SX,ny:SY,p:0,mv:0,dir:0,step:0,px:SX,py:SY};
const held=[];
const KM={ArrowDown:0,s:0,ArrowUp:1,w:1,ArrowLeft:2,a:2,ArrowRight:3,d:3};
const kd=e=>e.key.length===1?e.key.toLowerCase():e.key;
addEventListener('keydown',e=>{
  const k=kd(e);
  if(GS!=='play'){
    if(k==='Enter'||k===' '){e.preventDefault();if(!e.repeat){if(startReady())startGame();else if(winReady())location.reload();}}
    return;
  }
  if(DEV){
    e.preventDefault();
    if(k==='Enter'||k===' '){if(!e.repeat)devAct();}
    else if(k==='Escape')closeDev(false);
    else if(KM[k]!==undefined)devNav(KM[k]);
    return;
  }
  if(k==='Enter'){e.preventDefault();if(!e.repeat)openDev(nearBirds()[0]);return;}
  const d=KM[k];if(d===undefined)return;e.preventDefault();if(!held.includes(d))held.push(d)});
addEventListener('keyup',e=>{const d=KM[kd(e)];if(d===undefined)return;const i=held.indexOf(d);if(i>-1)held.splice(i,1)});
addEventListener('blur',()=>{held.length=0});

/* ---------- bird songs ---------- */
let AC=null;
const ac=()=>{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;};
/* background music: Garden.mp3 sits in the same folder as this HTML file */
const BV=1,clk=()=>performance.now()/1000;
const bgm=new Audio('Garden.mp3');bgm.loop=true;
let bgmGain=null,mt=null,blocked=false,bgmTried=false,bgmFailed=false,bgTgt=-1,GS='intro',PT0=null,WT0=0;   // mt = time the music started
try{const a=ac();bgmGain=a.createGain();bgmGain.gain.value=0;a.createMediaElementSource(bgm).connect(bgmGain);bgmGain.connect(a.destination);}catch(_){bgmGain=null;bgm.volume=BV;}
function tryBgm(){
  bgmTried=true;
  if(bgmFailed){if(mt===null)mt=clk();return;}
  if(bgmGain&&AC.state!=='running'){blocked=true;return;}
  bgm.play().then(()=>{if(mt===null)mt=clk();blocked=false;}).catch(e=>{if(e&&e.name==='NotAllowedError')blocked=true;else if(mt===null)mt=clk();});
}
bgm.addEventListener('error',()=>{bgmFailed=true;if(bgmTried&&mt===null)mt=clk();});
['keydown','pointerdown'].forEach(n=>addEventListener(n,()=>{
  ac();
  if(blocked&&mt===null)bgm.play().then(()=>{if(mt===null)mt=clk();blocked=false;}).catch(e=>{if(!e||e.name!=='NotAllowedError'){if(mt===null)mt=clk();}});
},true));
function audioTick(t){
  if(!bgmTried&&t>=1)tryBgm();
  if(bgmGain){
    const tgt=(mt!==null&&!DEV)?BV:0;   // quick fade out while the device is open, quick fade back in after
    if(tgt!==bgTgt){bgTgt=tgt;bgmGain.gain.setTargetAtTime(tgt,AC.currentTime,tgt?.12:.06);}
  }
}
const startReady=()=>GS==='intro'&&mt!==null&&clk()-mt>=6.75;
const winReady=()=>GS==='won'&&clk()-WT0>=1.5;
function startGame(){GS='play';PT0=clk();held.length=0;}
function nearBirds(){
  return BIRDS.map(b=>[Math.max(Math.abs(P.px-b.t.x),Math.abs(P.py-b.t.y)),b]).filter(a=>a[0]<=1.05&&!a[1].done).sort((a,b)=>a[0]-b[0]).map(a=>a[1]);
}
let voice=null;
function chirp(m){
  const f=440*Math.pow(2,(m-69)/12);
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  const n=AC.currentTime,o=AC.createOscillator(),lfo=AC.createOscillator(),ld=AC.createGain(),gn=AC.createGain();
  if(voice){try{const gv=voice.g.gain;gv.cancelScheduledValues(n);gv.setValueAtTime(gv.value,n);gv.setTargetAtTime(.0001,n,.03);voice.o.stop(n+.2);voice.l.stop(n+.2);}catch(_){}}
  voice={o,l:lfo,g:gn};
  o.setPeriodicWave(AC.createPeriodicWave(new Float32Array([0,0,0,0]),new Float32Array([0,1,.22,.07])));
  o.frequency.setValueAtTime(f*.94,n);o.frequency.exponentialRampToValueAtTime(f,n+.07);
  lfo.frequency.value=7.5;ld.gain.value=f*.012;lfo.connect(ld);ld.connect(o.frequency);
  gn.gain.setValueAtTime(.0001,n);gn.gain.exponentialRampToValueAtTime(.22,n+.025);
  gn.gain.exponentialRampToValueAtTime(.12,n+1.4);gn.gain.exponentialRampToValueAtTime(.0001,n+2);
  o.connect(gn);gn.connect(AC.destination);
  o.start(n);lfo.start(n);o.stop(n+2.05);lfo.stop(n+2.05);
}
function chord(){
  const a=ac(),now=a.currentTime;
  if(voice){try{const gv=voice.g.gain;gv.cancelScheduledValues(now);gv.setValueAtTime(gv.value,now);gv.setTargetAtTime(.0001,now,.03);voice.o.stop(now+.2);voice.l.stop(now+.2);}catch(_){}}
  [[.1,.03,.02],[1,.13,.07]].forEach(p=>{   // G4 Bb4 Eb5: 0.1s, then 1s, back to back
    const d=p[0],t0=now+p[1],rl=p[2];
    [67,70,75].forEach(m=>{
      const f=440*Math.pow(2,(m-69)/12),o=a.createOscillator(),lfo=a.createOscillator(),ld=a.createGain(),gn=a.createGain();
      o.setPeriodicWave(a.createPeriodicWave(new Float32Array([0,0,0,0,0]),new Float32Array([0,1,.34,.14,.05])));
      o.frequency.value=f;lfo.frequency.value=7.5;ld.gain.value=f*.008;lfo.connect(ld);ld.connect(o.frequency);
      gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(.13,t0+.02);
      gn.gain.setValueAtTime(.13,t0+d-rl);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);
      o.connect(gn);gn.connect(a.destination);
      o.start(t0);lfo.start(t0);o.stop(t0+d+.02);lfo.stop(t0+d+.02);
    });
  });
}
function buzz(){
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')AC.resume();
  const n=AC.currentTime,gn=AC.createGain();
  gn.gain.setValueAtTime(.14,n);gn.gain.setValueAtTime(.14,n+.35);gn.gain.exponentialRampToValueAtTime(.0001,n+.5);
  gn.connect(AC.destination);
  [92,97].forEach(fr=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=fr;o.connect(gn);o.start(n);o.stop(n+.52);});
}

/* ---------- pitch-matching device ---------- */
const KN=[62,63,65,67,68,70,72,74,75,77,79];   // D4 Eb4 F4 G4 Ab4 Bb4 C5 D5 Eb5 F5 G5
let DEV=null;
const DVR={x:68,y:16,w:104,h:144},SCR={x:74,y:27,w:40,h:36},PLY={x:73,y:78,w:42,h:20},CHK={x:73,y:121,w:42,h:20},NY=i=>138-10*i;
const inR=(x,y,r)=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h;
function openDev(b){
  if(!b||DEV||b.done)return;
  if(b.n===undefined)b.n=Math.random()*11|0;
  DEV={b,sel:0,last:0,k:5,fl:null,ft:0};held.length=0;
  b.sing=2;chirp(KN[b.n]);
}
function closeDev(solved){if(solved&&DEV){DEV.b.done=true;FILLED.push(DEV.b);if(FILLED.length>=10){GS='won';WT0=clk();}}DEV=null;held.length=0;}
function devNav(d){
  if(DEV.fl==='g')return;
  if(DEV.sel===3){
    const k0=DEV.k;
    if(d===1)DEV.k=Math.min(10,DEV.k+1);else if(d===0)DEV.k=Math.max(0,DEV.k-1);else if(d===2)DEV.sel=DEV.last;
    if(DEV.k!==k0)chirp(KN[DEV.k]);
  }else if(d===0)DEV.sel=Math.min(2,DEV.sel+1);
  else if(d===1)DEV.sel=Math.max(0,DEV.sel-1);
  else if(d===3){DEV.last=DEV.sel;DEV.sel=3;}
}
function devAct(){
  if(DEV.fl==='g')return;
  const b=DEV.b;
  if(DEV.sel===0){b.sing=2;chirp(KN[b.n]);}
  else if(DEV.sel===1)chirp(KN[DEV.k]);
  else if(DEV.sel===2){
    if(DEV.k===b.n){DEV.fl='g';DEV.ft=1.3;chord();}
    else{DEV.fl='r';DEV.ft=.6;buzz();}
  }
}
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*cv.width/r.width,y=(e.clientY-r.top)*cv.height/r.height;
  if(GS!=='play'){if(startReady()&&inR(x,y,STB))startGame();else if(winReady()&&inR(x,y,PAB))location.reload();return;}
  if(DEV){
    if(DEV.fl==='g')return;
    if(inR(x,y,SCR)){DEV.sel=0;devAct();}
    else if(inR(x,y,PLY)){DEV.sel=1;devAct();}
    else if(inR(x,y,CHK)){DEV.sel=2;devAct();}
    else if(x>=124&&x<=170&&y>=28&&y<=148){if(DEV.sel!==3)DEV.last=DEV.sel;DEV.sel=3;const k0=DEV.k;DEV.k=Math.max(0,Math.min(10,Math.round((138-y)/10)));if(DEV.k!==k0)chirp(KN[DEV.k]);}
    else if(!inR(x,y,DVR))closeDev(false);

});

function tryStart(carry){
  if(!held.length)return;
  const d=held[held.length-1];P.dir=d;
  const nx=P.tx+DX[d],ny=P.ty+DY[d];
  if(B[ny*W+nx])return;
  P.mv=1;P.nx=nx;P.ny=ny;P.p=carry;
}
function update(dt){
  for(const b of BIRDS)if(b.sing>0)b.sing=Math.max(0,b.sing-dt);
  if(GS!=='play')return;
  if(DEV){
    if(DEV.ft>0){DEV.ft-=dt;if(DEV.ft<=0){if(DEV.fl==='g')closeDev(true);else DEV.fl=null;}}
    return;
  }
  if(!P.mv)tryStart(0);
  else{P.p+=dt/STEP;if(P.p>=1){const c=P.p-1;P.tx=P.nx;P.ty=P.ny;P.mv=0;P.step^=1;tryStart(c);}}
  P.px=P.tx+(P.mv?(P.nx-P.tx)*P.p:0);P.py=P.ty+(P.mv?(P.ny-P.ty)*P.p:0);
}

function render(t,dt){
  const camX=Math.max(0,Math.min(W*TS-cv.width,Math.round(P.px*TS+8-cv.width/2)));
  const camY=Math.max(0,Math.min(H*TS-cv.height,Math.round(P.py*TS+8-cv.height/2)));
  const x0=camX/TS|0,y0=camY/TS|0,x1=Math.min(W-1,x0+VW),y1=Math.min(H-1,y0+VH);
  const g=ctx;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const i=y*W+x,sx=x*TS-camX,sy=y*TS-camY,hv=((x*73856093)^(y*19349663))>>>0;
    if(T[i]){
      g.drawImage(WAT[(Math.floor(t*1.4)+x+y)&1],sx,sy);
      for(let k=0;k<4;k++)if(!wat(x+ED[k][0],y+ED[k][1])){
        g.fillStyle='#e6fbf3';g.fillRect(sx+FA[k][0],sy+FA[k][1],FA[k][2],FA[k][3]);
        g.fillStyle='#a8e8f4';g.fillRect(sx+FB[k][0],sy+FB[k][1],FB[k][2],FB[k][3]);
      }
      continue;
    }
    g.drawImage((TU[i]?G2:G1)[hv%3],sx,sy);
    for(let k=0;k<4;k++)if(wat(x+ED[k][0],y+ED[k][1])){g.fillStyle='#3f8f48';g.fillRect(sx+FA[k][0],sy+FA[k][1],FA[k][2],FA[k][3]);}
    if(RK[i])g.drawImage(ROCK,sx,sy);
    const fl=FL[i];
    if(fl)for(const f of fl){
      const o=wind(x*TS+f.x,y*TS,t)>1.5?1:0,px=sx+f.x+o,py=sy+f.y;
      g.fillStyle='#3f9a47';g.fillRect(sx+f.x,py+2,1,3);
      let col=FC[f.c];
      if(f.c===7){
        const k=.5+.5*Math.sin(t*2.5+f.x*3+f.y);col=k>.5?'#d6ffff':'#7ff0ff';
        g.globalAlpha=.18+.2*k;g.fillStyle='#8ff5ff';g.fillRect(px-2,py-2,5,5);g.globalAlpha=1;
      }
      g.fillStyle=col;
      if(f.k===0){g.fillRect(px-1,py,3,1);g.fillRect(px,py-1,1,3);g.fillStyle=f.c===2?'#ff9f1c':'#ffe066';g.fillRect(px,py,1,1);}
      else if(f.k===1){g.fillRect(px,py,2,2);g.fillStyle='rgba(255,255,255,.7)';g.fillRect(px,py,1,1);}
      else{g.fillRect(px-1,py,3,2);g.fillRect(px,py-1,1,1);}
    }
    if(TU[i]){
      const lean=Math.round(wind(x*TS+8,y*TS,t)*1.1);
      for(let j=0;j<5;j++){
        const h=BL[j][1]+((x*7+y*13+j)%3)-1,bx=sx+BL[j][0],by=sy+15;
        for(let k=0;k<h;k++){
          const off=Math.round(lean*Math.pow(k/h,1.5));
          g.fillStyle=TC[Math.min(3,k*4/h|0)];
          g.fillRect(bx+off,by-k,k<h-2?2:1,1);
        }
      }
    }
  }
  // trees and player, sorted by row
  let drew=false;const RING=[];
  const pdraw=()=>{drawPlayer(Math.round(P.px*TS)-camX,Math.round(P.py*TS)-camY);drew=true;};
  for(const tr of trees){
    const cx=tr.x*TS+8,by=tr.y*TS+16;
    if(cx+16<camX||cx-16>camX+cv.width||by<camY||by-40>camY+cv.height)continue;
    if(!drew&&tr.y>P.py)pdraw();
    const dx=cx-16-camX,dy=by-40-camY,spr=TREES[tr.t][tr.v];
    g.drawImage(spr[0],dx,dy);
    const sw=wind(cx,by,t)>1.7?1:0;
    g.drawImage(spr[1],dx+sw,dy);
    const bd=tr.bird;
    if(bd){
      bd.sx=dx+sw+11+bd.ox;bd.sy=dy+6+bd.oy;drawBird(bd.sx,bd.sy,bd,t);
      if(!bd.done&&!DEV&&GS==='play'&&Math.max(Math.abs(P.px-tr.x),Math.abs(P.py-tr.y))<=1.05&&Math.floor(t*4)%2===0)RING.push(bd);
    }
    if(tr.t===4)for(let k=0;k<3;k++){
      if(Math.sin(t*2+tr.s+k*2.1)>.6){g.fillStyle='#e0ffff';g.fillRect(dx+sw+6+((tr.s*7+k*11)%20),dy+5+((tr.s*3+k*5)%14),1,1);}
    }
  }
  if(!drew)pdraw();
  // drifting petals
  for(const p of PET){
    p.x+=(p.v+wind(p.x,p.y,t)*10)*dt;p.y+=(3+Math.sin(t*2+p.ph)*5)*dt;
    const sx=p.x-camX,sy=p.y-camY;
    if(sx>cv.width+8){p.x=camX-8;p.y=camY+Math.random()*cv.height;}
    else if(sx<-24){p.x=camX+cv.width+8;p.y=camY+Math.random()*cv.height;}
    else if(sy>cv.height+8){p.y=camY-8;p.x=camX+Math.random()*cv.width;}
    else if(sy<-8){p.y=camY+cv.height+8;p.x=camX+Math.random()*cv.width;}
    g.fillStyle=p.c;g.fillRect((p.x-camX)|0,(p.y-camY)|0,2,1);
  }
  g.drawImage(VIG,0,0);
  // sunset to night: multiply toward #3F48CC over 60 seconds
  const k=PT0===null?0:Math.max(0,Math.min(1,(t-PT0-180)/60)),nm=[63,72,204].map(v=>Math.round(255+(v-255)*k));
  g.globalCompositeOperation='multiply';g.fillStyle='rgb('+nm.join(',')+')';g.fillRect(0,0,cv.width,cv.height);
  g.globalCompositeOperation='source-over';
  // bird highlight, drawn after the night tint so the yellow stays bright
  for(const b of RING)ring(b,t);
  // fireflies: appear a couple at a time once the fade to night begins
  if(PT0!==null&&t-PT0>=180&&MOTE.length<30&&t>=nextMote){
    for(let n=1+(Math.random()<.5?1:0);n--;)MOTE.push({x:camX+Math.random()*cv.width,y:camY+Math.random()*cv.height,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*5,ph:Math.random()*6,b:t,c:['#9dff6a','#6dff4a','#b8ff7a'][Math.random()*3|0]});
    nextMote=t+1.5+Math.random()*1.5;
  }
  for(const m of MOTE){
    m.x+=(m.vx+Math.sin(t*.7+m.ph)*4)*dt;m.y+=(m.vy+Math.cos(t*.9+m.ph*2)*4)*dt;
    let sx=m.x-camX,sy=m.y-camY;
    if(sx<-16){m.x=camX+cv.width+8;m.y=camY+Math.random()*cv.height;}
    else if(sx>cv.width+16){m.x=camX-8;m.y=camY+Math.random()*cv.height;}
    else if(sy<-16){m.y=camY+cv.height+8;m.x=camX+Math.random()*cv.width;}
    else if(sy>cv.height+16){m.y=camY-8;m.x=camX+Math.random()*cv.width;}
    sx=Math.round(m.x-camX);sy=Math.round(m.y-camY);
    const a=.5+.5*Math.sin(t*1.8+m.ph*3),fa=Math.min(1,(t-m.b)/2);
    g.fillStyle=m.c;
    g.globalAlpha=(.12+a*.2)*fa;g.fillRect(sx-2,sy,5,1);g.fillRect(sx,sy-2,1,5);
    g.globalAlpha=(.25+a*.3)*fa;g.fillRect(sx-1,sy-1,3,3);
    g.globalAlpha=(.6+a*.4)*fa;g.fillStyle='#f2ffe0';g.fillRect(sx,sy,1,1);
    g.globalAlpha=1;
  }
  if(GS==='play'||GS==='won'){drawTally(g,t);drawSun(g,t,k);}
  // intro: black screen, then the world fades in, then the title and Start button
  let ba=1,ta=0,sa=0;
  if(GS==='play'||GS==='won'){ba=0;ta=Math.max(0,1-(t-PT0)/2);}
  else if(mt!==null){const m=t-mt;ba=m<3?1:Math.max(0,1-(m-3)/3);ta=sa=Math.max(0,Math.min(1,(m-6)/1.5));}
  if(ta>0&&GS!=='play'){g.fillStyle='rgba(20,10,50,'+(.28*ta)+')';g.fillRect(0,0,cv.width,cv.height);}
  if(ta>0)drawTitle(g,ta);
  if(sa>0)drawStart(g,sa,t,STB,'Start');
  if(GS==='won'){
    const w=Math.max(0,Math.min(1,(t-WT0)/1.5));
    g.fillStyle='rgba(20,10,50,'+(.4*w)+')';g.fillRect(0,0,cv.width,cv.height);
    g.globalAlpha=w;g.textAlign='center';g.font='16px "Press Start 2P",monospace';
    g.fillStyle='#2a2140';g.fillText('You Win!',cv.width/2+2,62);
    g.fillStyle='#ffe9a8';g.fillText('You Win!',cv.width/2,60);
    g.font='8px "Press Start 2P",monospace';g.fillStyle='#fff4e0';g.fillText('You matched all 10 birds',cv.width/2,88);
    g.globalAlpha=1;
    drawStart(g,w,t,PAB,'Play Again');
  }
  if(ba>0){g.globalAlpha=ba;g.fillStyle='#000';g.fillRect(0,0,cv.width,cv.height);g.globalAlpha=1;}
  if(mt===null&&blocked&&t>=1){
    g.globalAlpha=.45+.35*Math.sin(t*3);g.font='8px "Press Start 2P",monospace';g.textAlign='center';
    g.fillStyle='#cfe8d0';g.fillText('Press any key or tap',cv.width/2,92);g.globalAlpha=1;
  }
  if(DEV)drawDev(g,t);
}
let last=performance.now();const T0=last;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  audioTick(now/1000);update(dt);render(now/1000,dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
